<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - READZONE</title>
    <script src="https://kit.fontawesome.com/dfce23e0ae.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="Login_Proyecto.css">
</head>
<body>
    <div class="container">
        <div class="login-box">

            <!-- Icono de perfil decorativo -->
            <div class="profile">
                <i class="fa-solid fa-user"></i>
            </div>

            <form id="loginForm" novalidate>

                <div class="input-box">
                    <i class="fa-solid fa-envelope"></i>
                    <input
                        type="email"
                        id="correo"
                        placeholder="Correo Electrónico"
                        autocomplete="email"
                        required>
                </div>

                <div class="input-box">
                    <i class="fa-solid fa-lock"></i>
                    <input
                        type="password"
                        id="contraseña"
                        placeholder="Contraseña"
                        autocomplete="current-password"
                        required>
                </div>

                <button type="submit" id="btnEntrar" class="btn">
                    Entrar
                </button>

            </form>
        </div>
    </div>

    <script src="Login_Proyecto.js"></script>
</body>
</html>
