<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Editar Historia - READZONE</title>

<link rel="stylesheet" href="Editar_contenido.css">

<script src="https://kit.fontawesome.com/dfce23e0ae.js" crossorigin="anonymous"></script>
</head>
<body>

<header class="header">

    <div class="header-left">
        <i class="fa-solid fa-arrow-left"></i>
        <div>
            <span>Editar Detalles de la Historia</span>
            <h2 id="nombreHistoria">
                Historia Sin Título
            </h2>
        </div>

    </div>
    <div class="header-right">
        <a href="Modificar_historias.html">
            <button class="cancelar-btn">
                Cancelar
            </button>
        </a>
        <a href="Modificar_historias.html">
            <button class="guardar-btn">
                Guardar
            </button>
        </a>
    </div>

</header>
<main class="editor-container">

    <!-- PORTADA -->
    <section class="portada-panel">
        <div class="imagen-box">
            <img
                id="portadaPreview"
                src=""
                alt="Portada"
            >

            <button id="editarPortada">
                <i class="fa-solid fa-pencil"></i>
            </button>

            <input
                type="file"
                id="nuevaPortada"
                hidden
            >

        </div>

        <button class="vista-previa-btn">
            Vista previa
        </button>
    </section>

    <!-- FORMULARIO -->
    <section class="datos-panel">
        <!-- TABS -->
        <div class="tabs">
            <button class="tab activo" data-tab="detalles">
                Detalles de la Historia
            </button>

            <button class="tab" data-tab="contenidos">
                Tabla de Contenidos
            </button>
        </div>

        <div class="contenido" id="detallesPanel">
            
            <!-- TITULO -->
            <div class="grupo">
                <label>Título</label>
                <input
                    type="text"
                    id="tituloHistoria"
                >
            </div>

            <!-- DESCRIPCION -->
            <div class="grupo">

                <label>
                    Descripción
                    <i class="fa-solid fa-circle-info"></i>
                </label>

                <textarea id="descripcionHistoria"></textarea>
            </div>

            <!-- CATEGORIA -->
            <div class="grupo">
                <label>Categoría</label>
                <select id="categoria">
                    <option>Acción</option>
                    <option>Aventura</option>
                    <option>Romance</option>
                    <option>Drama</option>
                    <option>Fantasía</option>
                    <option>Terror</option>
                </select>
            </div>

            <!-- ETIQUETAS -->
            <div class="grupo">
                <label>Etiquetas</label>
                <input
                    type="text"
                    id="etiquetas"
                >
            </div>

            <!-- AUDIENCIA -->
            <div class="grupo">
                <label>Audiencia Principal</label>
                <select id="audiencia">
                    <option>Adolescente</option>
                    <option>Adulto joven</option>
                    <option>Adulto</option>
                </select>
            </div>

            <!-- IDIOMA -->
            <div class="grupo">
                <label>Idioma</label>
                <select id="idioma">
                    <option>Español</option>
                    <option>English</option>
                </select>
            </div>

            <!-- DERECHOS -->
            <div class="grupo">
                <label>Derechos de Autor</label>
                <select id="derechos">
                    <option>
                        Todos los derechos reservados
                    </option>

                    <option>
                        Creative Commons
                    </option>
                </select>
            </div>

            <!-- CLASIFICACION -->
            <div class="grupo">
                <label>Clasificación</label>
                <div class="switch-box">
                    <span>Madura</span>
                    <label class="switch">
                        <input
                            type="checkbox"
                            id="contenidoAdulto"
                        >
                        <span class="slider"></span>
                    </label>
                </div>
            </div>

            <!-- ESTADO -->
            <div class="grupo">
                <label>Estado de la Historia</label>
                <div class="switch-box">
                    <span>¿Completa?</span>
                    <label class="switch">
                        <input
                            type="checkbox"
                            id="historiaCompleta"
                        >

                        <span class="slider"></span>
                    </label>
                </div>
            </div>
        </div>

        <!--  Contenidos  -->
        <div class="contenido oculto" id="capitulosPanel">
            <button class="nuevo-capitulo-btn">
                + Nuevo Capítulo
            </button>
            <div id="listaCapitulos">
            </div>
        </div>
    </section>

</main>

<script src="Editar_contenido.js"></script>

</body>
</html>
