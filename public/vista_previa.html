<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vista previa - READZONE</title>
    <link rel="stylesheet" href="vista_previa.css">
    <script src="https://kit.fontawesome.com/dfce23e0ae.js" crossorigin="anonymous"></script>
</head>
<body>

    <header class="topbar">
        <div class="logo">READZONE</div>

        <span class="badge-preview">
            <i class="fa-solid fa-eye"></i>
            Vista previa
        </span>

        <button class="btn-volver" onclick="window.close()">
            <i class="fa-solid fa-xmark"></i>
            Cerrar vista previa
        </button>
    </header>

    <div class="contenedor">

        <main class="lectura">
            <h1 id="tituloCapitulo">Sin título</h1>
            <div id="contenidoCapitulo" class="contenido-texto"></div>
        </main>

        <aside class="sidebar">
            <img
                id="portadaHistoria"
                class="portada"
                src=""
                alt="Portada"
                onerror="this.style.display='none'">

            <h3 id="nombreHistoria"></h3>

            <p class="aviso-preview">
                <i class="fa-solid fa-circle-info"></i>
                Esta es una vista previa. El contenido aún no está publicado.
            </p>
        </aside>

    </div>

    <script src="vista_previa.js"></script>
</body>
</html>
