<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Biblioteca | READZONE</title>
    <link rel="stylesheet" href="Libreria_historias.css">
    <script src="https://kit.fontawesome.com/dfce23e0ae.js" crossorigin="anonymous"></script>
</head>
<body>

    <header class="header-biblioteca">
        <h1>
            <i class="fa-solid fa-book-bookmark"></i>
            Biblioteca
        </h1>
        <span class="privado">
            <i class="fa-solid fa-lock"></i>
            Privada
        </span>
    </header>

    <main>

        <!-- MENSAJE VACÍO -->
        <div id="mensajeVacio" class="mensaje-vacio" style="display:none;">
            <i class="fa-solid fa-book-open"></i>
            <h2>Tu biblioteca está vacía</h2>
            <p>Agrega alguna historia para poder leerla aquí.</p>
            <a href="Proyecto.html" class="link-explorar">
                <button class="btn-explorar">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    Explorar historias
                </button>
            </a>
        </div>

        <!-- CARGANDO -->
        <div id="mensajeCargando" class="mensaje-vacio">
            <i class="fa-solid fa-circle-notch fa-spin"></i>
            <p>Cargando biblioteca...</p>
        </div>

        <!-- GRID DE HISTORIAS -->
        <div id="contenedorHistorias" class="grid-historias"></div>

    </main>

    <script src="Libreria_historias.js"></script>
</body>
</html>
