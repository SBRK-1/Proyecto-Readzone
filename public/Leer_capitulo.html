<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leer - READZONE</title>
    <link rel="stylesheet" href="Leer_capitulo.css">
    <script src="https://kit.fontawesome.com/dfce23e0ae.js" crossorigin="anonymous"></script>
</head>
<body>

    <!-- BARRA SUPERIOR -->
    <header class="topbar-lector">
        <button id="btnVolver" class="btn-icono" title="Volver">
            <i class="fa-solid fa-arrow-left"></i>
        </button>

        <span id="nombreHistoriaTop" class="titulo-top">Cargando...</span>

        <button id="btnToggleSidebar" class="btn-icono" title="Tabla de contenido">
            <i class="fa-solid fa-list"></i>
        </button>
    </header>

    <!-- OVERLAY para cerrar sidebar en móvil -->
    <div class="overlay" id="overlay"></div>

    <div class="contenedor-lector">

        <!-- SIDEBAR: tabla de contenido -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2 id="nombreHistoria">Historia</h2>
                <button class="btn-cerrar-sidebar" id="btnCerrarSidebar" title="Cerrar">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div id="listaCapitulos">
                <p class="sidebar-cargando">Cargando capítulos...</p>
            </div>
        </aside>

        <!-- LECTOR PRINCIPAL -->
        <main class="lector" id="lector">

            <h1 id="tituloCapitulo" class="titulo-capitulo">Cargando...</h1>

            <div id="contenidoCapitulo" class="contenido-texto">
                <p class="texto-cargando">
                    <i class="fa-solid fa-spinner fa-spin"></i> Cargando contenido...
                </p>
            </div>

            <!-- NAVEGACIÓN ENTRE CAPÍTULOS -->
            <div class="navegacion">
                <button id="btnAnterior" class="btn-nav btn-anterior" style="display:none;">
                    <i class="fa-solid fa-chevron-left"></i>
                    Capítulo anterior
                </button>

                <button id="btnSiguiente" class="btn-nav btn-siguiente" style="display:none;">
                    Siguiente capítulo
                    <i class="fa-solid fa-chevron-right"></i>
                </button>
            </div>

        </main>
    </div>

    <script src="Leer_capitulo.js"></script>
</body>
</html>
